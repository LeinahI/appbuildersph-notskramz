openapi: 3.1.0
info:
  title: Ugatan ws API
  version: 0.2.0
  description: Registration, QR claim, and sample product API for Ugatan.
servers:
  - url: http://localhost:8080
paths:
  /up:
    get:
      summary: Health check
      responses:
        "200":
          description: Service is healthy
  /api/v1/auth/login:
    post:
      summary: Admin login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string }
                password: { type: string }
      responses:
        "200":
          description: JWT and admin user
        "401":
          description: Invalid credentials
  /api/v1/auth/me:
    get:
      summary: Current admin
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Admin user
  /api/v1/users:
    get:
      summary: List farmers
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: q
          schema: { type: string }
        - in: query
          name: status
          schema: { type: string, enum: [pending, active, revoked] }
      responses:
        "200":
          description: User list
    post:
      summary: Register farmer (after admin confirm)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterUserRequest"
      responses:
        "201":
          description: Created pending user
  /api/v1/users/{id}:
    get:
      summary: Get user (includes active invite if any)
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: User
        "404":
          description: Not found
  /api/v1/users/{id}/invites:
    post:
      summary: Create single-use QR invite
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "201":
          description: Invite with claimUrl
  /api/v1/users/{id}/invites/regenerate:
    post:
      summary: Revoke previous invite and create a new one
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: New invite
  /api/v1/users/{id}/revoke:
    post:
      summary: Revoke user access
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Revoked
  /api/v1/invites/{id}/revoke:
    post:
      summary: Revoke invite
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Revoked
  /api/v1/invites/claim:
    post:
      summary: Farmer claims QR invite (public)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, deviceId]
              properties:
                token: { type: string }
                deviceId: { type: string }
      responses:
        "200":
          description: Linked userId and session token
  /api/v1/audit:
    get:
      summary: List audit events
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Audit list
  /api/v1/conversations:
    get:
      summary: List farmer conversations
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: q
          schema: { type: string }
      responses:
        "200":
          description: Conversation list
    post:
      summary: Create conversation
      security: [{ bearerAuth: [] }]
      responses:
        "201":
          description: Created
  /api/v1/conversations/{id}:
    patch:
      summary: Rename or pin conversation
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Updated
    delete:
      summary: Delete conversation
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Deleted
  /api/v1/conversations/{id}/messages:
    get:
      summary: List messages
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Messages
    put:
      summary: Replace full conversation messages
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Saved
  /api/v1/products:
    get:
      summary: List products
      parameters:
        - in: query
          name: q
          schema: { type: string }
      responses:
        "200":
          description: Product list
    post:
      summary: Create product
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProductRequest"
      responses:
        "201":
          description: Created
  /api/v1/products/{id}:
    get:
      summary: Get product by ID
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Product
        "404":
          description: Not found
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    RegisterUserRequest:
      type: object
      required: [fullName, birthDate, address]
      properties:
        fullName: { type: string }
        birthDate: { type: string, format: date, description: YYYY-MM-DD }
        phone: { type: string }
        idNumber: { type: string, description: Hashed at rest; never store raw searchable ID }
        consentAt: { type: string, format: date-time }
        address:
          type: object
          required: [line1, barangay, city, province]
          properties:
            line1: { type: string }
            line2: { type: string }
            barangay: { type: string }
            city: { type: string }
            province: { type: string }
            postalCode: { type: string }
    Product:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
        description: { type: string }
        price: { type: string }
        stock: { type: integer }
    CreateProductRequest:
      type: object
      required: [name, slug, price, stock]
      properties:
        name: { type: string }
        slug: { type: string }
        description: { type: string }
        price: { type: string }
        stock: { type: integer }
